services:
  autoops-mysql:
    image: crpi-aj3vgoxp9kzh2jx4.cn-hangzhou.personal.cr.aliyuncs.com/zhangfan_k8s/mysql:8.0.33
    container_name: autoops-mysql
    restart: unless-stopped
    ports:
      - "${MYSQL_PORT:-3307}:3306"
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-devops@2025}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-autoops}
      AUTOOPS_MYSQL_BOOTSTRAP_CHECK: ${AUTOOPS_MYSQL_BOOTSTRAP_CHECK:-required}
      TZ: ${TZ:-Asia/Shanghai}
    volumes:
      - ./mysql/data:/var/lib/mysql
      - ./mysql/devops001.sql:/docker-entrypoint-initdb.d/01-devops.sql:ro
      - ./mysql/conf.d:/etc/mysql/conf.d:ro
    command:
      - --default-authentication-plugin=caching_sha2_password
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
    networks:
      - autoops-network
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -uroot -p\"$${MYSQL_ROOT_PASSWORD}\" --silent && { [ \"$${AUTOOPS_MYSQL_BOOTSTRAP_CHECK}\" = legacy ] || mysql -h 127.0.0.1 -uroot -p\"$${MYSQL_ROOT_PASSWORD}\" -D \"$${MYSQL_DATABASE}\" -Nse \"SELECT meta_value FROM system_migration_meta WHERE meta_key='autoops_docker_bootstrap_v1'\" 2>/dev/null | grep -qx complete; }"]
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 30s

  autoops-redis:
    image: crpi-aj3vgoxp9kzh2jx4.cn-hangzhou.personal.cr.aliyuncs.com/zhangfan_k8s/redis:6.2
    container_name: autoops-redis
    restart: unless-stopped
    ports:
      - "${REDIS_PORT:-6379}:6379"
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:-devops@2025}
      TZ: ${TZ:-Asia/Shanghai}
    command:
      - /bin/sh
      - -ec
      - exec redis-server --appendonly yes --requirepass "$${REDIS_PASSWORD}"
    volumes:
      - ./redis/data:/data
    networks:
      - autoops-network
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a \"$${REDIS_PASSWORD}\" ping | grep -q PONG"]
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 10s

  autoops-victoriametrics:
    image: crpi-aj3vgoxp9kzh2jx4.cn-hangzhou.personal.cr.aliyuncs.com/zhangfan_k8s/victoria-metrics:latest
    container_name: autoops-victoriametrics
    restart: unless-stopped
    ports:
      - "${VICTORIAMETRICS_PORT:-8428}:8428"
    command:
      - -storageDataPath=/victoria-metrics-data
      - -retentionPeriod=${VICTORIAMETRICS_RETENTION:-90d}
      - -httpListenAddr=:8428
    volumes:
      - victoria-metrics-data:/victoria-metrics-data
    networks:
      - autoops-network
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://127.0.0.1:8428/health"]
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 10s

  autoops-victorialogs:
    image: crpi-aj3vgoxp9kzh2jx4.cn-hangzhou.personal.cr.aliyuncs.com/zhangfan_k8s/victoria-logs:latest
    container_name: autoops-victorialogs
    restart: unless-stopped
    ports:
      - "${VICTORIALOGS_PORT:-9428}:9428"
    command:
      - -storageDataPath=/victoria-logs-data
      - -retentionPeriod=${VICTORIALOGS_RETENTION:-30d}
      - -httpListenAddr=:9428
    volumes:
      - victoria-logs-data:/victoria-logs-data
    networks:
      - autoops-network
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://127.0.0.1:9428/health"]
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 10s

  autoops-kafka:
    image: crpi-aj3vgoxp9kzh2jx4.cn-hangzhou.personal.cr.aliyuncs.com/zhangfan_k8s/kafka:4.0.0
    container_name: autoops-kafka
    restart: unless-stopped
    ports:
      - "${KAFKA_PORT:-9092}:9092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: INTERNAL://:29092,EXTERNAL://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://autoops-kafka:29092,EXTERNAL://${KAFKA_ADVERTISED_HOST:-127.0.0.1}:${KAFKA_PORT:-9092}
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,INTERNAL:PLAINTEXT,EXTERNAL:PLAINTEXT
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@autoops-kafka:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_NUM_PARTITIONS: 6
      KAFKA_LOG_DIRS: /var/lib/kafka/data
    volumes:
      - kafka-data:/var/lib/kafka/data
    networks:
      - autoops-network

  autoops-vector-aggregator:
    image: crpi-aj3vgoxp9kzh2jx4.cn-hangzhou.personal.cr.aliyuncs.com/zhangfan_k8s/vector:latest-debian
    container_name: autoops-vector-aggregator
    restart: unless-stopped
    security_opt:
      - seccomp=unconfined
    pids_limit: -1
    ulimits:
      nproc:
        soft: 65535
        hard: 65535
    volumes:
      - ./vector/vector.yaml:/etc/vector/vector.yaml:ro
      - vector-aggregator-data:/var/lib/aiops-vector-aggregator
    command:
      - --config
      - /etc/vector/vector.yaml
    networks:
      - autoops-network
    depends_on:
      - autoops-kafka
      - autoops-victorialogs

  autoops-api:
    image: ${AUTOOPS_API_IMAGE:-crpi-aj3vgoxp9kzh2jx4.cn-hangzhou.personal.cr.aliyuncs.com/zhangfan_k8s/deviops-api:v1.0}
    container_name: autoops-api
    restart: unless-stopped
    ports:
      - "${API_PORT:-8000}:8000"
    environment:
      TZ: ${TZ:-Asia/Shanghai}
      AUTOOPS_DATA_DIR: /var/lib/autoops
    volumes:
      - ${API_CONFIG_FILE:-./api/config.yaml}:/app/config.yaml:ro
      - ./api/logs:/app/log
      - ./api/upload:/app/upload
      - autoops-data:/var/lib/autoops
      - ./api/ssh_keys:/root/.ssh:ro
    networks:
      - autoops-network
    depends_on:
      autoops-mysql:
        condition: service_healthy
      autoops-redis:
        condition: service_healthy
      autoops-victoriametrics:
        condition: service_started
      autoops-victorialogs:
        condition: service_started
      autoops-kafka:
        condition: service_started
    healthcheck:
      test: ["CMD", "curl", "--fail", "--silent", "http://127.0.0.1:8000/api/v1/captcha"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 60s

  autoops-web:
    image: ${AUTOOPS_WEB_IMAGE:-crpi-aj3vgoxp9kzh2jx4.cn-hangzhou.personal.cr.aliyuncs.com/zhangfan_k8s/deviops-web:v1.0}
    container_name: autoops-web
    restart: unless-stopped
    ports:
      - "${WEB_PORT:-8088}:80"
    environment:
      TZ: ${TZ:-Asia/Shanghai}
    volumes:
      - ./web/devops.conf:/etc/nginx/conf.d/default.conf
    networks:
      - autoops-network
    depends_on:
      - autoops-api
    healthcheck:
      test: ["CMD-SHELL", "nginx -t -q && test -s /usr/share/nginx/html/index.html"]
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 10s

networks:
  autoops-network:
    driver: bridge

volumes:
  autoops-data:
    name: autoops-data
  kafka-data:
  vector-aggregator-data:
  victoria-logs-data:
  victoria-metrics-data:
