server:
  address: 0.0.0.0:8000
  model: release
  enableSwagger: true
  publicUrl: "http://__SERVER_HOST__:__API_PORT__"

db:
  dialects: mysql
  host: autoops-mysql
  port: 3306
  db: __MYSQL_DATABASE__
  username: root
  password: "__MYSQL_ROOT_PASSWORD__"
  charset: utf8
  maxIdle: 50
  maxOpen: 150
  autoMigrate: true

redis:
  address: autoops-redis:6379
  password: "__REDIS_PASSWORD__"

imageSettings:
  uploadDir: ./upload/
  imageHost: "http://__SERVER_HOST__:__WEB_PORT__"

log:
  path: ./log
  name: sys
  model: console

logtail:
  delivery_mode: auto
  victorialogs:
    url: "http://autoops-victorialogs:9428/"
    timeout_seconds: 10
  kafka:
    enabled: true
    brokers:
      - "__SERVER_HOST__:__KAFKA_PORT__"
    topic: "aiops-logs"
  vector:
    image: "crpi-aj3vgoxp9kzh2jx4.cn-hangzhou.personal.cr.aliyuncs.com/zhangfan_k8s/vector:latest-debian"
    packagePath: "./upload/logtail/vector"
    disk_buffer_max_size_bytes: 2147483648
  aggregator:
    image: "crpi-aj3vgoxp9kzh2jx4.cn-hangzhou.personal.cr.aliyuncs.com/zhangfan_k8s/vector:latest-debian"

monitor:
  victoriametrics:
    url: "http://autoops-victoriametrics:8428"
  metrics_push:
    url: "http://__SERVER_HOST__:__VICTORIAMETRICS_PORT__/api/v1/import/prometheus"
  agent:
    version: "2.1.0"
    version_tag: "v2"
    heartbeat_server_url: "http://__SERVER_HOST__:__API_PORT__/api/v1/monitor/agent/heartbeat"
    heartbeat_token: "agent-heartbeat-token-2024"
    heartbeat_timeout_seconds: 300
  webhook:
    token: "webhook-notify-token-2024"
  alert_scraper_time: 60

wecom:
  plugin_token: "replace-with-wecom-aiops-plugin-token"

mcp:
  token: "replace-with-aiops-mcp-token"

windows_exporter:
  installer_base_url: "http://__SERVER_HOST__:__API_PORT__/api/v1/upload/windows_exporter/"
  default_version: "0.31.3"
  default_port: 9182
  enabled_collectors: "cpu,logical_disk,net,os,system,service,memory,process"
  push_mode:
    enabled: true
    interval: 60
    metrics_push_url: "http://__SERVER_HOST__:__VICTORIAMETRICS_PORT__/api/v1/import/prometheus"
